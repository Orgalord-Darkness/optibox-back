name: optibox-dev-backend

services:
  spring-app:
    build: ./spring-app
    container_name: spring-dev-app
    ports:
      - "${SPRING_PORT}:8000"
    volumes:
      - /var/www/OPtiBox_dev/optibox-back/pdfs:/var/www/OPtiBox_dev/optibox-back/pdfs:z
      - ./spring-app/src/main/resources/templates:/app/src/main/resources/templates:z
      - ./spring-app/data/monthly-controls:/app/data/monthly-controls:z
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mariadb://db:3306/${MYSQL_DATABASE}"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      PLC_URL: "${PLC_URL}"
      PLC_USER: "${PLC_USER}"
      PLC_PASSWORD: "${PLC_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - optibox-dev-shared-network

  db:
    image: mariadb:latest
    container_name: db-dev
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./docker-config/databases:/docker-entrypoint-initdb.d:Z
      - db_data:/var/lib/mysql        # ✅ Volume persistant ajouté ici
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD-SHELL", "if [ -d /var/lib/mysql/moyens_levage_dev ]; then exit 0; else exit 1; fi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - optibox-dev-shared-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-dev
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: "${PMA_HOST}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      UPLOAD_LIMIT: 20M
    networks:
      - optibox-dev-shared-network
    depends_on: 
      db

networks:
  optibox-dev-shared-network:
    external: true

volumes:
  db_data:
